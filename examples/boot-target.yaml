# Optional boot example for any board with a serial console and USB SD mux.
# UART and mux are separate labgrid resources, not requirements of this library.
targets:
  main:
    resources:
      RemotePlace:
        name: dut
    drivers:
      SerialDriver: {}
      USBSDMuxDriver: {}
      NetworkPowerDriver:
        delay: 3.0
