## Optional example: replace all placeholders with your hardware's identifiers.
## Run the exporter with --isolated; start the power proxy with --outlet 1=outlet.
dut:
  NetworkPowerPort:
    model: rest
    host: 'http://127.0.0.1:20409/outlets/{index}'
    index: 1
  USBSerialPort:
    match:
      ID_SERIAL_SHORT: 'YOUR_UART_SERIAL'
      ID_USB_INTERFACE_NUM: 'YOUR_UART_INTERFACE'
    speed: 115200
  USBSDMuxDevice:
    match:
      ID_SERIAL_SHORT: 'YOUR_SDMUX_SERIAL'
