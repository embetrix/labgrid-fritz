## Run labgrid-fritz-proxy on the exporter host with --outlet 1=outlet.
## Run the exporter with --isolated so labgrid tunnels this URL through SSH.
## The client uses stock labgrid; no plugin or client YAML is required.
dut:
  NetworkPowerPort:
    model: rest
    host: 'http://127.0.0.1:20409/outlets/{index}'
    index: 1
